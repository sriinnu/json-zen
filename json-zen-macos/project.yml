name: JSONZen
options:
  bundleIdPrefix: com.jsonzen
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: "Manual"
    DEVELOPMENT_TEAM: ""

targets:
  JSONZen:
    type: application
    platform: macOS
    sources:
      - path: JSONZen
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsonzen.app
        INFOPLIST_FILE: JSONZen/Info.plist
        CODE_SIGN_ENTITLEMENTS: JSONZen/JSONZen.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
    entitlements:
      path: JSONZen/JSONZen.entitlements
      properties:
        com.apple.security.app-sandbox: false

schemes:
  JSONZen:
    build:
      targets:
        JSONZen: all
    run:
      config: Debug
    archive:
      config: Release
