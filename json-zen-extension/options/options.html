<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Zen - Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="settings">
    <header class="header">
      <h1>JSON Zen Settings</h1>
    </header>

    <main class="content">
      <section class="settings-section">
        <h2>Formatting</h2>

        <div class="setting">
          <label for="indent-size">Indentation Size</label>
          <select id="indent-size">
            <option value="2">2 spaces</option>
            <option value="4">4 spaces</option>
            <option value="8">8 spaces</option>
            <option value="tab">Tabs</option>
          </select>
        </div>

        <div class="setting">
          <label for="theme">Theme</label>
          <select id="theme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="system">System</option>
          </select>
        </div>
      </section>

      <section class="settings-section">
        <h2>Behavior</h2>

        <div class="setting">
          <label for="auto-copy">
            <input type="checkbox" id="auto-copy">
            Auto-copy output to clipboard
          </label>
        </div>

        <div class="setting">
          <label for="auto-format">
            <input type="checkbox" id="auto-format">
            Auto-format on paste
          </label>
        </div>
      </section>

      <section class="settings-section">
        <h2>Keyboard Shortcuts</h2>
        <div class="shortcuts-list">
          <div class="shortcut">
            <span>Format JSON</span>
            <kbd>Ctrl+Shift+F</kbd>
          </div>
          <div class="shortcut">
            <span>Minify JSON</span>
            <kbd>Ctrl+Shift+M</kbd>
          </div>
          <div class="shortcut">
            <span>Fix JSON</span>
            <kbd>Ctrl+Shift+X</kbd>
          </div>
          <div class="shortcut">
            <span>Validate JSON</span>
            <kbd>Ctrl+Shift+V</kbd>
          </div>
        </div>
      </section>

      <section class="settings-section">
        <h2>About</h2>
        <p class="about-text">
          JSON Zen v1.1.0<br>
          Made with love by <strong>Srinivas Pendela</strong><br>
          <small style="color: var(--text-secondary);">© 2020-2026</small>
        </p>
        <div class="about-links">
          <a href="https://github.com/sriinnu/json-zen" target="_blank" class="about-link">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.01 0-.77-.01-1.52-.01-2.19-2.21.45-2.67-1.06-2.67-1.06-.59-1.49-1.45-1.49-1.45-.97-.66.07-.65.07-.65.73.05 1.12.76 1.12.76 1 1.77 1.36 2.39.96.4-.26.77-.76.77-.76-1.43-1.52-3.63-1.52-5.5 0-4.55 3.17-8.23 7.58-8.23.4 0 .74.04 1.12.11.69-2.27 2.38-3.91 4.48-4.16-.44-.12-.9-.12-1.37-.12-2.61 0-4.72 2.12-4.72 4.72 0 .93.26 1.79.72 2.52-.07.18-.12.37-.12.57v2.95c0 1.94 2.31 3.41 4.98 3.41 2.67 0 4.98-1.47 4.98-3.41v-2.95c0-.2-.05-.39-.12-.57.46-.73.72-1.59.72-2.52 0-2.6-2.12-4.72-4.72-4.72-.47 0-.93.04-1.37.12-2.1-.25-3.1-1.89-4.48-4.16-.07-.38-.11-.78-.11-1.19z"/>
            </svg>
            GitHub Repository
          </a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <button id="save-btn" class="btn btn-primary">Save Settings</button>
      <button id="reset-btn" class="btn btn-outline">Reset to Defaults</button>
    </footer>
  </div>

  <script src="options.js"></script>
</body>
</html>
