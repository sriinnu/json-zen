<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    
    <!-- Glass effect gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.1)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.02)"/>
    </linearGradient>
    
    <!-- Brace gradient (blue to purple) -->
    <linearGradient id="braceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    
    <!-- Zen circle gradient (teal to blue) -->
    <linearGradient id="zenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(59,130,246,0.3)"/>
    </filter>
  </defs>
  
  <!-- Main background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Glass inner circle -->
  <circle cx="64" cy="64" r="56" fill="url(#glassGrad)"/>
  
  <!-- Subtle outer glow ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#braceGrad)" stroke-width="1.5" opacity="0.25" filter="url(#glow)"/>
  
  <!-- Zen circle (Enso-inspired - representing zen/calm) -->
  <circle cx="64" cy="64" r="32" fill="none" stroke="url(#zenGrad)" stroke-width="3" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Left brace { with glow -->
  <path d="M38 48 C34 48,32 52,32 56 L32 60 C32 64,30 66,26 68 L26 70 C30 72,32 74,32 78 L32 82 C32 86,34 90,38 90" 
        fill="none" stroke="url(#braceGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Right brace } with glow -->
  <path d="M90 48 C94 48,96 52,96 56 L96 60 C96 64,98 66,102 68 L102 70 C98 72,96 74,96 78 L96 82 C96 86,94 90,90 90" 
        fill="none" stroke="url(#braceGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Data nodes (representing JSON structure) -->
  <g fill="url(#braceGrad)" filter="url(#glow)">
    <circle cx="50" cy="56" r="3" opacity="0.9"/>
    <circle cx="64" cy="48" r="3" opacity="0.7"/>
    <circle cx="78" cy="56" r="3" opacity="0.8"/>
    <circle cx="56" cy="76" r="3" opacity="0.6"/>
    <circle cx="72" cy="76" r="3" opacity="0.7"/>
  </g>
  
  <!-- Connection lines between nodes -->
  <g stroke="url(#braceGrad)" stroke-width="1.5" opacity="0.35">
    <line x1="50" y1="56" x2="64" y2="48"/>
    <line x1="64" y1="48" x2="78" y2="56"/>
    <line x1="50" y1="56" x2="56" y2="76"/>
    <line x1="78" y1="56" x2="72" y2="76"/>
    <line x1="56" y1="76" x2="72" y2="76"/>
  </g>
  
  <!-- Glass shine reflection -->
  <ellipse cx="48" cy="40" rx="18" ry="10" fill="rgba(255,255,255,0.08)" transform="rotate(-30 48 40)"/>
</svg>
