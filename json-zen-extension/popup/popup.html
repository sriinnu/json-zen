<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JSON Zen</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --surface-3: #3a3a3c;
      --border: rgba(255,255,255,0.08);
      --text: #f5f5f7;
      --text2: #8e8e93;
      --text3: #636366;
      --accent: #0a84ff;
      --accent-grad: linear-gradient(135deg, #0a84ff, #5e5ce6);
      --purple: #bf5af2;
      --purple-grad: linear-gradient(135deg, #bf5af2, #9b5de8);
      --green: #30d158;
      --red: #ff453a;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --glow-blue: 0 0 20px rgba(10,132,255,0.3);
      --glow-purple: 0 0 20px rgba(191,90,242,0.3);
    }
    :root.light {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --surface-2: #f5f5f7;
      --surface-3: #e5e5ea;
      --border: rgba(0,0,0,0.08);
      --text: #1c1c1e;
      --text2: #6e6e73;
      --text3: #aeaeb2;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      width: 720px;
      height: 520px;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-icon svg { width: 18px; height: 18px; }
    .logo-text {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-pill {
      padding: 6px 14px;
      background: var(--surface-2);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .status-pill::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text3);
    }
    .status-pill.success { background: rgba(48,209,88,0.15); color: var(--green); }
    .status-pill.success::before { background: var(--green); }
    .status-pill.error { background: rgba(255,69,58,0.15); color: var(--red); }
    .status-pill.error::before { background: var(--red); }
    .theme-toggle {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s ease;
    }
    .theme-toggle:hover { background: var(--surface-3); color: var(--text); }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent-grad);
      color: #fff;
      box-shadow: var(--glow-blue);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(10,132,255,0.4); }
    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--surface-3); border-color: var(--text3); }
    .btn-fix {
      background: var(--purple-grad);
      color: #fff;
      box-shadow: var(--glow-purple);
    }
    .btn-fix:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(191,90,242,0.4); }
    .btn-icon {
      padding: 6px 8px;
      background: transparent;
      color: var(--text2);
    }
    .btn-icon svg {
      width: 14px;
      height: 14px;
    }
    .btn-icon:hover { color: var(--text); background: var(--surface-2); }
    .divider { width: 1px; height: 24px; background: var(--border); margin: 0 8px; }

    /* Main Content */
    .main {
      display: flex;
      height: calc(100% - 140px);
      background: var(--bg);
    }
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }
    .panel + .panel {
      border-left: 1px solid var(--border);
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .panel-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text2);
    }
    .panel-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .char-count {
      font-size: 11px;
      color: var(--text3);
      font-variant-numeric: tabular-nums;
    }
    .panel-btn {
      padding: 6px 12px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .panel-btn:hover { background: #007aff; }
    .panel-btn.danger { background: transparent; color: var(--red); }
    .panel-btn.danger:hover { background: rgba(255,69,58,0.1); }
    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      font-size: 14px;
    }
    .icon-btn:hover { background: var(--surface-3); color: var(--text); }

    /* Input/Output */
    #input {
      flex: 1;
      padding: 16px;
      background: var(--bg);
      border: none;
      color: var(--text);
      font: 13px/1.6 'SF Mono', Menlo, Monaco, monospace;
      resize: none;
      outline: none;
      font-variant-ligatures: none;
    }
    #input::placeholder { color: var(--text3); }

    #output {
      flex: 1;
      padding: 16px;
      overflow: auto;
      font: 13px/1.6 'SF Mono', Menlo, Monaco, monospace;
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--bg);
      font-variant-ligatures: none;
    }

    /* Syntax Highlighting */
    .key { color: #64d2ff; }
    .string { color: #32d74b; }
    .number { color: #ffd60a; }
    .boolean { color: #bf5af2; }
    .null { color: var(--text3); }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 10px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .shortcut {
      font-size: 11px;
      color: var(--text3);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    kbd {
      padding: 2px 6px;
      background: var(--surface-2);
      border-radius: 4px;
      font-family: inherit;
      font-size: 10px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .panel { animation: fadeIn 0.2s ease; }

    /* Dropdown */
    .dropdown { position: relative; z-index: 1000; }
    .dropdown-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      min-width: 140px;
      box-shadow: var(--shadow);
      display: none;
      z-index: 100;
    }
    .dropdown:hover .dropdown-menu,
    .dropdown.active .dropdown-menu {
      display: block;
    }
    .dropdown-item {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
    }
    .dropdown-item:hover {
      background: var(--accent);
      color: #fff;
    }
    .dropdown-divider {
      height: 1px;
      background: var(--border);
      margin: 6px 0;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <rect width="24" height="24" rx="5" fill="#1a1a2e"/>
          <rect x="3" y="3" width="18" height="18" rx="3" fill="#0f4c75" opacity="0.4"/>
          <path d="M8 6v3c0 .6-.4 1-1 1s-1-.4-1-1V6c0-.6.4-1 1-1" stroke="#bbe1fa" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M16 6v3c0 .6.4 1 1 1s1-.4 1-1V6c0-.6-.4-1-1-1" stroke="#bbe1fa" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <circle cx="11" cy="7" r="1" fill="#bbe1fa"/>
          <circle cx="11" cy="10" r="1" fill="#bbe1fa"/>
          <path d="M8 15h6" stroke="#bbe1fa" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="logo-text">JSON Zen</span>
    </div>
    <div class="header-actions">
      <div class="status-pill" id="status">Ready</div>
      <button class="theme-toggle" id="theme" title="Toggle theme">🌙</button>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn btn-primary" id="format">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M4 6h16M4 12h12M4 18h16"/>
      </svg>
      Format
    </button>
    <button class="btn btn-secondary" id="minify">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      Minify
    </button>
    <button class="btn btn-fix" id="fix">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2v4m0 12v4M2 12h4m12 0h4"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      Fix
    </button>
    <button class="btn btn-secondary" id="validate">Validate</button>
    <div class="divider"></div>
    <button class="btn btn-secondary" id="sort">Sort</button>
    <button class="btn btn-secondary" id="stats">Stats</button>
    <div class="dropdown">
      <button class="btn btn-secondary dropdown-toggle" id="convertBtn">
        Convert
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      <div class="dropdown-menu" id="convertMenu">
        <button class="dropdown-item" data-convert="yaml">YAML</button>
        <button class="dropdown-item" data-convert="xml">XML</button>
        <button class="dropdown-item" data-convert="csv">CSV</button>
        <button class="dropdown-item" data-convert="toml">TOML</button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item" data-convert="base64">Base64</button>
        <button class="dropdown-item" data-convert="url">URL Encode</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Input</span>
        <div class="panel-actions">
          <button class="icon-btn" id="paste" title="Paste from clipboard">📋</button>
          <button class="panel-btn danger" id="clear">Clear</button>
        </div>
      </div>
      <textarea id="input" placeholder="Paste JSON here to format, minify, fix or validate..."></textarea>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Output</span>
        <div class="panel-actions">
          <span class="char-count" id="info">0 chars</span>
          <button class="panel-btn" id="copy">Copy</button>
        </div>
      </div>
      <pre id="output"></pre>
    </div>
  </div>

  <footer class="footer">
    <span class="shortcut"><kbd>⌘</kbd><kbd>⇧</kbd><kbd>F</kbd> Format</span>
    <span class="shortcut"><kbd>⌘</kbd><kbd>⇧</kbd><kbd>M</kbd> Minify</span>
    <span class="shortcut"><kbd>⌘</kbd><kbd>⇧</kbd><kbd>X</kbd> Fix</span>
  </footer>

  <script src="../utils/json-utils.js"></script>
  <script src="popup-script.js"></script>
</body>
</html>
