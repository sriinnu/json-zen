<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient - deep dark like the screenshot -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#12121a"/>
      <stop offset="100%" style="stop-color:#1a1a25"/>
    </linearGradient>

    <!-- Glass effect gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" style="stop-color:#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" style="stop-color:#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Accent gradient for braces -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow filter -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- Glass blur filter -->
    <filter id="glassBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Main background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- ==================== LAYERED CARDS (the "decked" effect) ==================== -->
  <!-- Back layer card -->
  <g transform="translate(256, 256)">
    <rect x="-140" y="-140" width="280" height="280" rx="52"
          fill="url(#glassGrad)" stroke="#ffffff" stroke-width="0.5"
          stroke-opacity="0.08" filter="url(#softShadow)"
          transform="rotate(-6) translate(8, 8)"/>
  </g>

  <!-- Middle layer card -->
  <g transform="translate(256, 256)">
    <rect x="-135" y="-135" width="270" height="270" rx="50"
          fill="url(#glassGrad)" stroke="#ffffff" stroke-width="0.8"
          stroke-opacity="0.12" filter="url(#softShadow)"
          transform="rotate(-3) translate(4, 4)"/>
  </g>

  <!-- Main card (glassmorphism) -->
  <g transform="translate(256, 256)">
    <rect x="-130" y="-130" width="260" height="260" rx="48"
          fill="url(#glassGrad)" stroke="#ffffff" stroke-width="1"
          stroke-opacity="0.15" filter="url(#softShadow)"/>

    <!-- Inner glow / border highlight -->
    <rect x="-130" y="-130" width="260" height="260" rx="48"
          fill="none" stroke="#3B82F6" stroke-width="1.5"
          stroke-opacity="0.3"/>
  </g>

  <!-- ==================== JSON BRACES ==================== -->
  <!-- Left brace -->
  <path d="M156 160v45c0 12-10 22-24 22s-24-10-24-22v-45c0-12 10-22 24-22v0"
        stroke="url(#accentGrad)" stroke-width="14" fill="none"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Right brace -->
  <path d="M356 160v45c0 12 10 22 24 22s24-10 24-22v-45c0-12-10-22-24-22v0"
        stroke="url(#accentGrad)" stroke-width="14" fill="none"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- ==================== JSON DATA REPRESENTATION ==================== -->
  <!-- Key dots (cyan/teal accent) -->
  <circle cx="196" cy="183" r="8" fill="#22D3EE" opacity="0.95"/>
  <circle cx="196" cy="208" r="8" fill="#22D3EE" opacity="0.95"/>

  <!-- Data lines -->
  <rect x="218" y="172" width="100" height="10" rx="5" fill="#94A3B8" opacity="0.9"/>
  <rect x="218" y="190" width="65" height="10" rx="5" fill="#64748B" opacity="0.8"/>

  <!-- Nested data -->
  <rect x="188" y="218" width="120" height="10" rx="5" fill="#94A3B8" opacity="0.7"/>
  <rect x="202" y="236" width="90" height="10" rx="5" fill="#475569" opacity="0.6"/>
  <rect x="202" y="254" width="75" height="10" rx="5" fill="#475569" opacity="0.5"/>

  <!-- ==================== ACCENT LINE ==================== -->
  <path d="M170 300h172" stroke="url(#accentGrad)" stroke-width="3"
        stroke-linecap="round" opacity="0.6"/>

  <!-- ==================== ZEN SYMBOL (enhanced) ==================== -->
  <g transform="translate(256, 360)">
    <!-- Outer ring with glow -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#accentGrad)"
            stroke-width="2" opacity="0.4" filter="url(#glow)"/>
    <!-- Middle ring -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#3B82F6"
            stroke-width="1.5" opacity="0.25"/>
    <!-- Inner filled circle -->
    <circle cx="0" cy="0" r="16" fill="url(#accentGrad)" opacity="0.4"/>
    <!-- Center highlight -->
    <circle cx="-4" cy="-4" r="5" fill="#60A5FA" opacity="0.8"/>
  </g>

  <!-- ==================== SUBTLE PARTICLES / AMBIENCE ==================== -->
  <g opacity="0.4">
    <circle cx="380" cy="140" r="2" fill="#3B82F6"/>
    <circle cx="395" cy="155" r="1.5" fill="#60A5FA"/>
    <circle cx="130" cy="380" r="2" fill="#3B82F6"/>
    <circle cx="115" cy="365" r="1" fill="#60A5FA"/>
    <circle cx="400" cy="380" r="1.5" fill="#22D3EE"/>
  </g>

  <!-- ==================== CORNER ACCENTS ==================== -->
  <g opacity="0.1">
    <!-- Top left -->
    <path d="M60 100v-15c0-8 6-14 14-14h15" stroke="#ffffff" stroke-width="2"
          fill="none" stroke-linecap="round"/>
    <!-- Bottom right -->
    <path d="M452 412v15c0 8-6 14-14 14h-15" stroke="#ffffff" stroke-width="2"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
