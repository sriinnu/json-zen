<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="50%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>

    <!-- Accent gradient for braces -->
    <linearGradient id="braceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8"/>
      <stop offset="50%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#0284C7"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner shadow -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="table" tableValues="1 0"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main card background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#bgGradient)" filter="url(#innerShadow)"/>

  <!-- Subtle inner border/glow -->
  <rect x="16" y="16" width="480" height="480" rx="80"
        fill="none" stroke="url(#braceGradient)" stroke-width="2" opacity="0.3"/>

  <!-- Left brace -->
  <path d="M128 140v60c0 17.7-14.3 32-32 32s-32-14.3-32-32v-60c0-17.7 14.3-32 32-32v0"
        stroke="url(#braceGradient)" stroke-width="20" fill="none"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Right brace -->
  <path d="M384 140v60c0 17.7 14.3 32 32 32s32-14.3 32-32v-60c0-17.7-14.3-32-32-32v0"
        stroke="url(#braceGradient)" stroke-width="20" fill="none"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- JSON data representation -->
  <!-- Key-value pairs -->
  <circle cx="180" cy="165" r="12" fill="#38BDF8" opacity="0.9"/>
  <circle cx="180" cy="195" r="12" fill="#38BDF8" opacity="0.9"/>

  <!-- Data line 1 -->
  <rect x="210" y="148" width="160" height="14" rx="7" fill="#94A3B8"/>
  <rect x="210" y="172" width="100" height="14" rx="7" fill="#64748B"/>

  <!-- Data line 2 -->
  <rect x="160" y="210" width="192" height="14" rx="7" fill="#94A3B8"/>
  <rect x="184" y="234" width="140" height="14" rx="7" fill="#64748B"/>

  <!-- Nested object indicator -->
  <rect x="184" y="262" width="120" height="14" rx="7" fill="#475569"/>

  <!-- Bottom accent line -->
  <path d="M140 340h232" stroke="url(#braceGradient)" stroke-width="4"
        stroke-linecap="round" opacity="0.6"/>

  <!-- Zen symbol/subtle design element -->
  <circle cx="256" cy="380" r="40" fill="none" stroke="url(#braceGradient)"
          stroke-width="3" opacity="0.4"/>
  <circle cx="256" cy="380" r="28" fill="none" stroke="url(#braceGradient)"
          stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="380" r="16" fill="url(#braceGradient)" opacity="0.5"/>
</svg>
